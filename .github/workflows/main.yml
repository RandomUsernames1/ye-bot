name: 24/7 Bot Attempt
on:
  schedule:
    - cron: '0 */6 * * *'  # Restarts every 6 hours
  workflow_dispatch:        # Manual start button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node ye.js
