name: Run Ye Bot
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Restarts the bot every 6 hours
  workflow_dispatch:      # Allows you to start it manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run bot
        run: node ye.js
